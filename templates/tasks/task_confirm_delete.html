{% extends "base.html" %}
{% block title %}Delete Task · TaskFlow{% endblock %}

{% block content %}
<div class="container narrow">
    <div class="form-card danger-card">
        <h1>Delete task?</h1>
        <p>Are you sure you want to delete <strong>"{{ object.title }}"</strong>? This cannot be undone.</p>

        <form method="post" class="form-actions">
            {% csrf_token %}
            <a href="{% url 'tasks:list' %}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
        </form>
    </div>
</div>
{% endblock %}
